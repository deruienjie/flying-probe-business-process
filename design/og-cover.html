<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#0b1b3a 0%,#14336b 55%,#1d4ed8 100%);color:#fff}
  .wrap{padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .brand{font-size:13px;letter-spacing:3px;color:#93c5fd;font-weight:600}
  h1{font-size:58px;font-weight:700;margin:18px 0 14px;letter-spacing:1px}
  .sub{font-size:20px;color:#c7d7f5;line-height:1.6;max-width:820px}
  .stats{display:flex;gap:14px;margin-top:34px}
  .stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);
        border-radius:12px;padding:12px 20px;font-size:16px;color:#dbeafe}
  .stat b{font-size:26px;color:#fff;margin-right:8px}
  .foot{margin-top:auto;font-size:15px;color:#93c5fd;display:flex;justify-content:space-between;align-items:center}
  .chip{font-size:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
        border-radius:20px;padding:7px 16px;color:#e0e7ff}
  .glow{position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;
        background:radial-gradient(circle,rgba(96,165,250,.35),rgba(96,165,250,0) 68%)}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand">FLYING PROBE · BUSINESS PROCESS ANALYSIS</div>
    <h1>飞针设备制造 · 业务流程分析</h1>
    <div class="sub">从销售接单到财务回款的全链路拆解：每个环节谁在做、吃什么单、落在哪个系统、哪里会断、能不能被 AI 替掉</div>
    <div class="stats">
      <div class="stat"><b>9</b>业务阶段</div>
      <div class="stat"><b>75</b>微环节</div>
      <div class="stat"><b>8</b>金蝶模块</div>
      <div class="stat"><b>3</b>层下钻</div>
    </div>
    <div class="foot">
      <span>deruienjie.github.io/flying-probe-business-process</span>
      <span class="chip">点开可交互 · 手机电脑都适配</span>
    </div>
  </div>
</body>
</html>
